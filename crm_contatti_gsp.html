<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Contatti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F6F3;--surface:#FFFFFF;--border:#E2E0D8;--border-hover:#C8C6BC;
  --text:#1A1917;--text-muted:#6B6963;--text-hint:#A8A49E;--accent:#1A1917;
  --radius-sm:8px;--radius-md:12px;--radius-lg:16px;
  --shadow:0 1px 3px rgba(0,0,0,0.07);--shadow-lg:0 4px 16px rgba(0,0,0,0.10);
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
.app{max-width:900px;margin:0 auto;padding:0 1rem}
header{padding:1.5rem 0 1rem;border-bottom:1px solid var(--border);margin-bottom:1.5rem;display:flex;align-items:center;gap:12px}
.header-title h1{font-size:20px;font-weight:600;letter-spacing:-0.02em}
.header-title p{font-size:13px;color:var(--text-muted);margin-top:1px}
.sync-status{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#D1FAE5;flex-shrink:0;transition:background 0.3s}
.sync-dot.syncing{background:#FEF3C7;animation:pulse 1s infinite}
.sync-dot.error{background:#FEE2E2}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.toolbar{display:flex;gap:10px;margin-bottom:1.25rem;flex-wrap:wrap;align-items:center}
.search-box{position:relative;flex:1;min-width:180px}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-hint);pointer-events:none}
.search-box input{width:100%;padding:0 12px 0 34px;height:38px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--text)}
.search-box input:focus{outline:none;border-color:var(--border-hover)}
select{height:38px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 10px;font-size:14px;font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--text);cursor:pointer}
.btn-primary{height:38px;padding:0 18px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:opacity 0.15s}
.btn-primary:hover{opacity:0.85}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.5rem}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px}
.stat .label{font-size:12px;color:var(--text-muted);margin-bottom:4px;font-weight:500;text-transform:uppercase;letter-spacing:0.04em}
.stat .value{font-size:26px;font-weight:600;letter-spacing:-0.03em}
.contact-list{display:flex;flex-direction:column;gap:8px;padding-bottom:3rem}
.contact-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;transition:border-color 0.15s;cursor:pointer}
.contact-card:hover{border-color:var(--border-hover)}
.contact-card.open{border-color:#1A1917}
.card-summary{display:flex;align-items:center;gap:12px;padding:14px 16px;user-select:none}
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex-shrink:0}
.card-info{flex:1;min-width:0}
.card-name{font-size:15px;font-weight:600;letter-spacing:-0.01em}
.card-sub{font-size:13px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.card-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;letter-spacing:0.02em;text-transform:uppercase}
.b-caldo{background:#FEE2E2;color:#991B1B}
.b-tiepido{background:#FEF3C7;color:#92400E}
.b-freddo{background:#DBEAFE;color:#1E40AF}
.b-cliente{background:#D1FAE5;color:#065F46}
.b-inattivo{background:#F3F4F6;color:#374151}
.last-ago{font-size:12px;color:var(--text-hint);min-width:60px;text-align:right}
.chevron{color:var(--text-hint);transition:transform 0.2s;flex-shrink:0}
.contact-card.open .chevron{transform:rotate(180deg)}
.card-detail{border-top:1px solid var(--border);padding:16px;display:none;animation:slideDown 0.15s ease}
.contact-card.open .card-detail{display:block}
@keyframes slideDown{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.detail-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin-bottom:16px}
@media(max-width:500px){.detail-fields{grid-template-columns:1fr}}
.df-label{font-size:11px;color:var(--text-hint);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:2px;font-weight:500}
.df-val{font-size:14px;font-weight:500}
.df-val a{color:var(--text);text-decoration:underline;text-decoration-color:var(--border)}
.df-note{grid-column:1/-1;background:var(--bg);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;color:var(--text-muted);line-height:1.6}
.section-title{font-size:13px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:10px}
.log-list{display:flex;flex-direction:column}
.log-item{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)}
.log-item:last-child{border-bottom:none}
.log-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.li-chiamata{background:#DBEAFE;color:#1E40AF}
.li-email{background:#D1FAE5;color:#065F46}
.li-meeting{background:#FEF3C7;color:#92400E}
.li-nota{background:#F3F4F6;color:#374151}
.log-body{flex:1}
.log-tipo{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-muted)}
.log-testo{font-size:14px;margin-top:1px}
.log-date{font-size:12px;color:var(--text-hint);white-space:nowrap;margin-top:3px}
.no-log{font-size:13px;color:var(--text-hint);padding:8px 0;font-style:italic}
.add-log{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.add-log select{flex:0 0 110px;font-size:13px;height:34px}
.add-log input{flex:1;min-width:140px;height:34px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 10px;font-size:13px;font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--text)}
.add-log input:focus{outline:none;border-color:var(--border-hover)}
.btn-add{height:34px;padding:0 14px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;white-space:nowrap}
.btn-add:hover{opacity:0.85}
.card-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.btn-outline{height:32px;padding:0 14px;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;display:flex;align-items:center;gap:5px;transition:background 0.15s}
.btn-outline:hover{background:var(--bg);border-color:var(--border-hover)}
.btn-danger{color:#991B1B;border-color:#FEE2E2}
.btn-danger:hover{background:#FEF2F2;border-color:#FCA5A5}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:200;padding:1rem}
.modal{background:var(--surface);border-radius:var(--radius-lg);width:min(520px,100%);max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-header h2{font-size:17px;font-weight:600}
.btn-close{background:none;border:none;cursor:pointer;color:var(--text-muted);padding:4px;border-radius:6px;display:flex;align-items:center}
.btn-close:hover{background:var(--bg)}
.modal-body{padding:20px 24px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:480px){.form-grid{grid-template-columns:1fr}}
.form-row{display:flex;flex-direction:column;gap:5px}
.form-row label{font-size:13px;font-weight:500;color:var(--text-muted)}
.form-row input,.form-row select,.form-row textarea{height:38px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 12px;font-size:14px;font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--text);width:100%}
.form-row textarea{height:72px;padding:10px 12px;resize:vertical}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:none;border-color:var(--border-hover)}
.form-full{grid-column:1/-1}
.modal-footer{padding:16px 24px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.btn-cancel{height:38px;padding:0 18px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:'DM Sans',sans-serif;cursor:pointer}
.btn-cancel:hover{background:#EDEDEA}
.btn-save{height:38px;padding:0 20px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer}
.btn-save:hover{opacity:0.85}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1A1917;color:#fff;font-size:13px;font-family:'DM Sans',sans-serif;padding:10px 18px;border-radius:20px;opacity:0;transition:all 0.25s;z-index:300;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:4rem 1rem;color:var(--text-hint)}
.empty p{font-size:14px;margin-top:8px}
.loading{text-align:center;padding:4rem 1rem;color:var(--text-hint);font-size:14px}
</style>
</head>
<body>
<div class="app">
  <header>
    <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
      <rect width="36" height="36" rx="10" fill="#1A1917"/>
      <circle cx="18" cy="15" r="5" fill="white" opacity="0.9"/>
      <path d="M8 28c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    </svg>
    <div class="header-title">
      <h1>CRM Contatti</h1>
      <p>Gestione rubrica commerciale</p>
    </div>
    <div class="sync-status">
      <div class="sync-dot syncing" id="syncDot"></div>
      <span id="syncLabel">Connessione…</span>
    </div>
  </header>

  <div class="toolbar">
    <div class="search-box">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Cerca per nome, azienda…" oninput="render()">
    </div>
    <select id="filterStato" onchange="render()">
      <option value="">Tutti gli stati</option>
      <option value="caldo">🔥 Caldo</option>
      <option value="tiepido">🌤 Tiepido</option>
      <option value="freddo">❄️ Freddo</option>
      <option value="cliente">✅ Cliente</option>
      <option value="inattivo">💤 Inattivo</option>
    </select>
    <select id="sortBy" onchange="render()">
      <option value="ultimo">Ultimo contatto</option>
      <option value="nome">Nome A→Z</option>
      <option value="azienda">Azienda A→Z</option>
      <option value="stato">Stato</option>
    </select>
    <button class="btn-primary" onclick="openModal()">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      Nuovo contatto
    </button>
  </div>

  <div class="stats" id="statsBar"></div>
  <div id="contactList"><div class="loading">⏳ Caricamento contatti dal cloud…</div></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Nuovo contatto</h2>
      <button class="btn-close" onclick="closeModal()">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-row"><label>Nome *</label><input id="fNome" type="text" placeholder="Mario" autocomplete="off"></div>
        <div class="form-row"><label>Cognome *</label><input id="fCognome" type="text" placeholder="Rossi" autocomplete="off"></div>
        <div class="form-row form-full"><label>Azienda</label><input id="fAzienda" type="text" placeholder="Acme Srl" autocomplete="off"></div>
        <div class="form-row"><label>Ruolo</label><input id="fRuolo" type="text" placeholder="Responsabile acquisti" autocomplete="off"></div>
        <div class="form-row"><label>Stato</label>
          <select id="fStato">
            <option value="tiepido">🌤 Tiepido</option>
            <option value="caldo">🔥 Caldo</option>
            <option value="freddo">❄️ Freddo</option>
            <option value="cliente">✅ Cliente</option>
            <option value="inattivo">💤 Inattivo</option>
          </select>
        </div>
        <div class="form-row"><label>Email</label><input id="fEmail" type="email" placeholder="mario@acme.it" autocomplete="off"></div>
        <div class="form-row"><label>Telefono</label><input id="fTel" type="text" placeholder="+39 02 …" autocomplete="off"></div>
        <div class="form-row form-full"><label>Note</label><textarea id="fNote" placeholder="Interesse principale, contesto, prossimo step…"></textarea></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Annulla</button>
      <button class="btn-save" onclick="saveContact()">Salva contatto</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const BIN_ID = '6a01a1ebadc21f119a829e3a';
const API_KEY = '$2a$10$YiV7HEG63KRm.niJ4Fh9AOHrwkDNHhLG2cHybG2e8aXhBfQW09OQC';
const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

const AVATAR_COLORS=[
  {bg:'#DBEAFE',txt:'#1E40AF'},{bg:'#D1FAE5',txt:'#065F46'},
  {bg:'#FEF3C7',txt:'#92400E'},{bg:'#FCE7F3',txt:'#9D174D'},
  {bg:'#EDE9FE',txt:'#5B21B6'},{bg:'#FEE2E2',txt:'#991B1B'},
  {bg:'#F0FDF4',txt:'#14532D'},{bg:'#FFF7ED',txt:'#9A3412'},
];
const STATUS_ORDER={caldo:0,tiepido:1,freddo:2,cliente:3,inattivo:4};

function avatarStyle(name){const c=(name.charCodeAt(0)||0)+(name.charCodeAt(1)||0);return AVATAR_COLORS[c%AVATAR_COLORS.length]}
function initials(n,c){return((n[0]||'')+(c[0]||'')).toUpperCase()}
function badgeClass(s){return{caldo:'b-caldo',tiepido:'b-tiepido',freddo:'b-freddo',cliente:'b-cliente',inattivo:'b-inattivo'}[s]||'b-inattivo'}
function badgeLabel(s){return{caldo:'Caldo',tiepido:'Tiepido',freddo:'Freddo',cliente:'Cliente',inattivo:'Inattivo'}[s]||s}
function logIconClass(t){return{chiamata:'li-chiamata',email:'li-email',meeting:'li-meeting',nota:'li-nota'}[t]||'li-nota'}
function logIcon(t){
  const icons={
    chiamata:'<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.9 10.82a19.79 19.79 0 01-3.07-8.63A2 2 0 012.8 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 7.91a16 16 0 006.06 6.06l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>',
    email:'<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>',
    meeting:'<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
    nota:'<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>',
  };
  return icons[t]||icons.nota;
}
function daysSince(iso){
  if(!iso)return'';
  const d=Math.floor((Date.now()-new Date(iso))/86400000);
  if(d===0)return'oggi';if(d===1)return'ieri';if(d<7)return d+'g fa';
  if(d<30)return Math.floor(d/7)+'sett fa';if(d<365)return Math.floor(d/30)+'mesi fa';
  return Math.floor(d/365)+'a fa';
}
function formatDate(iso){if(!iso)return'';return new Date(iso).toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'})}
function todayISO(){return new Date().toISOString().slice(0,10)}
function escHtml(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

let contacts=[];
let openId=null;
let editingId=null;
let nextId=1;
let nextLogId=1;
let saveTimer=null;

function setSyncStatus(state,label){
  const dot=document.getElementById('syncDot');
  const lbl=document.getElementById('syncLabel');
  dot.className='sync-dot'+(state==='syncing'?' syncing':state==='error'?' error':'');
  lbl.textContent=label;
}

async function loadFromCloud(){
  setSyncStatus('syncing','Connessione…');
  try{
    const r=await fetch(API_URL+'/latest',{headers:{'X-Master-Key':API_KEY}});
    if(!r.ok)throw new Error(r.status);
    const data=await r.json();
    contacts=data.record.contacts||[];
    nextId=contacts.length>0?Math.max(...contacts.map(c=>c.id))+1:1;
    nextLogId=contacts.flatMap(c=>c.log).length>0?Math.max(...contacts.flatMap(c=>c.log.map(l=>l.id)))+1:1;
    setSyncStatus('ok','Sincronizzato');
    render();
  }catch(e){
    setSyncStatus('error','Errore connessione');
    document.getElementById('contactList').innerHTML='<div class="empty"><p>❌ Impossibile connettersi al cloud.<br>Controlla la connessione internet e ricarica la pagina.</p></div>';
  }
}

async function saveToCloud(){
  setSyncStatus('syncing','Salvataggio…');
  try{
    const r=await fetch(API_URL,{
      method:'PUT',
      headers:{'Content-Type':'application/json','X-Master-Key':API_KEY},
      body:JSON.stringify({contacts})
    });
    if(!r.ok)throw new Error(r.status);
    setSyncStatus('ok','Sincronizzato');
  }catch(e){
    setSyncStatus('error','Errore salvataggio');
    showToast('⚠️ Errore durante il salvataggio');
  }
}

function debouncedSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveToCloud,600);
}

function render(){
  const q=(document.getElementById('searchInput').value||'').toLowerCase();
  const fs=document.getElementById('filterStato').value;
  const sort=document.getElementById('sortBy').value;

  let list=contacts.filter(c=>{
    const hay=(c.nome+' '+c.cognome+' '+(c.azienda||'')+' '+(c.ruolo||'')).toLowerCase();
    return hay.includes(q)&&(!fs||c.stato===fs);
  });
  list.sort((a,b)=>{
    if(sort==='nome')return(a.nome+a.cognome).localeCompare(b.nome+b.cognome,'it');
    if(sort==='azienda')return(a.azienda||'ZZZ').localeCompare(b.azienda||'ZZZ','it');
    if(sort==='stato')return(STATUS_ORDER[a.stato]||9)-(STATUS_ORDER[b.stato]||9);
    const la=a.log[0]?.data||'0000';const lb=b.log[0]?.data||'0000';
    return lb.localeCompare(la);
  });

  const tot=contacts.length;
  const caldi=contacts.filter(c=>c.stato==='caldo').length;
  const clienti=contacts.filter(c=>c.stato==='cliente').length;
  const oggi=todayISO();
  const contattatoOggi=contacts.filter(c=>c.log[0]?.data===oggi).length;
  document.getElementById('statsBar').innerHTML=`
    <div class="stat"><div class="label">Totale</div><div class="value">${tot}</div></div>
    <div class="stat"><div class="label">Lead caldi</div><div class="value">${caldi}</div></div>
    <div class="stat"><div class="label">Clienti</div><div class="value">${clienti}</div></div>
    <div class="stat"><div class="label">Contattati oggi</div><div class="value">${contattatoOggi}</div></div>
  `;

  const cl=document.getElementById('contactList');
  if(!list.length){
    cl.innerHTML=`<div class="empty"><svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><p>${contacts.length===0?'Nessun contatto ancora. Clicca "Nuovo contatto" per iniziare!':'Nessun risultato per questa ricerca.'}</p></div>`;
    return;
  }

  cl.innerHTML=list.map(c=>{
    const av=avatarStyle(c.nome+c.cognome);
    const isOpen=openId===c.id;
    const ult=c.log[0];
    const logItems=c.log.map(l=>`
      <div class="log-item">
        <div class="log-icon ${logIconClass(l.tipo)}">${logIcon(l.tipo)}</div>
        <div class="log-body">
          <div class="log-tipo">${l.tipo}</div>
          <div class="log-testo">${escHtml(l.testo)}</div>
        </div>
        <div class="log-date">${formatDate(l.data)}</div>
      </div>`).join('');
    const fields=[];
    if(c.email)fields.push(`<div class="form-row"><div class="df-label">Email</div><div class="df-val"><a href="mailto:${escHtml(c.email)}">${escHtml(c.email)}</a></div></div>`);
    if(c.tel)fields.push(`<div class="form-row"><div class="df-label">Telefono</div><div class="df-val"><a href="tel:${escHtml(c.tel)}">${escHtml(c.tel)}</a></div></div>`);
    if(c.note)fields.push(`<div class="form-row form-full"><div class="df-label">Note</div><div class="df-note">${escHtml(c.note)}</div></div>`);

    return`<div class="contact-card${isOpen?' open':''}" id="card-${c.id}">
      <div class="card-summary" onclick="toggleCard(${c.id})">
        <div class="avatar" style="background:${av.bg};color:${av.txt}">${initials(c.nome,c.cognome)}</div>
        <div class="card-info">
          <div class="card-name">${escHtml(c.nome)} ${escHtml(c.cognome)}</div>
          <div class="card-sub">${c.ruolo?escHtml(c.ruolo)+' — ':''}${c.azienda?escHtml(c.azienda):'<span style="color:var(--text-hint)">—</span>'}</div>
        </div>
        <div class="card-right">
          <span class="badge ${badgeClass(c.stato)}">${badgeLabel(c.stato)}</span>
          ${ult?`<span class="last-ago">${daysSince(ult.data)}</span>`:'<span class="last-ago" style="color:var(--text-hint)">—</span>'}
          <svg class="chevron" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
      <div class="card-detail">
        ${fields.length?`<div class="detail-fields">${fields.join('')}</div>`:''}
        <div class="section-title">Storico contatti</div>
        <div class="log-list">${logItems||'<div class="no-log">Nessun contatto registrato.</div>'}</div>
        <div class="add-log">
          <select id="lt-${c.id}" onclick="event.stopPropagation()">
            <option value="chiamata">📞 Chiamata</option>
            <option value="email">📧 Email</option>
            <option value="meeting">📅 Meeting</option>
            <option value="nota">📝 Nota</option>
          </select>
          <input type="text" id="li-${c.id}" placeholder="Descrivi il contatto…" onclick="event.stopPropagation()" onkeydown="if(event.key==='Enter')addLog(${c.id})">
          <button class="btn-add" onclick="event.stopPropagation();addLog(${c.id})">Aggiungi</button>
        </div>
        <div class="card-actions">
          <button class="btn-outline" onclick="event.stopPropagation();editContact(${c.id})">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            Modifica
          </button>
          <button class="btn-outline btn-danger" onclick="event.stopPropagation();deleteContact(${c.id})">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
            Elimina
          </button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleCard(id){
  openId=openId===id?null:id;
  render();
  if(openId)setTimeout(()=>{const el=document.getElementById('card-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'})},50);
}

function openModal(id){
  editingId=id||null;
  if(id){
    const c=contacts.find(x=>x.id===id);
    document.getElementById('modalTitle').textContent='Modifica contatto';
    document.getElementById('fNome').value=c.nome;
    document.getElementById('fCognome').value=c.cognome;
    document.getElementById('fAzienda').value=c.azienda||'';
    document.getElementById('fRuolo').value=c.ruolo||'';
    document.getElementById('fStato').value=c.stato;
    document.getElementById('fEmail').value=c.email||'';
    document.getElementById('fTel').value=c.tel||'';
    document.getElementById('fNote').value=c.note||'';
  }else{
    document.getElementById('modalTitle').textContent='Nuovo contatto';
    ['fNome','fCognome','fAzienda','fRuolo','fEmail','fTel','fNote'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('fStato').value='tiepido';
  }
  document.getElementById('modalOverlay').style.display='flex';
  setTimeout(()=>document.getElementById('fNome').focus(),50);
}
function closeModal(){document.getElementById('modalOverlay').style.display='none'}

function saveContact(){
  const nome=document.getElementById('fNome').value.trim();
  const cognome=document.getElementById('fCognome').value.trim();
  if(!nome||!cognome){alert('Nome e cognome sono obbligatori.');return;}
  const data={nome,cognome,
    azienda:document.getElementById('fAzienda').value.trim(),
    ruolo:document.getElementById('fRuolo').value.trim(),
    stato:document.getElementById('fStato').value,
    email:document.getElementById('fEmail').value.trim(),
    tel:document.getElementById('fTel').value.trim(),
    note:document.getElementById('fNote').value.trim()};
  if(editingId){
    const i=contacts.findIndex(c=>c.id===editingId);
    contacts[i]={...contacts[i],...data};
    showToast('Contatto aggiornato ✓');
  }else{
    contacts.unshift({...data,id:nextId++,log:[]});
    showToast('Contatto aggiunto ✓');
  }
  closeModal();render();debouncedSave();
}

function editContact(id){openModal(id)}

function deleteContact(id){
  if(!confirm('Eliminare questo contatto? L\'operazione non è reversibile.'))return;
  contacts=contacts.filter(c=>c.id!==id);
  if(openId===id)openId=null;
  render();debouncedSave();
  showToast('Contatto eliminato');
}

function addLog(cid){
  const tipo=document.getElementById('lt-'+cid).value;
  const testo=document.getElementById('li-'+cid).value.trim();
  if(!testo){document.getElementById('li-'+cid).focus();return;}
  const c=contacts.find(x=>x.id===cid);
  c.log.unshift({id:nextLogId++,data:todayISO(),tipo,testo});
  render();debouncedSave();
  showToast('Contatto registrato ✓');
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if(e.key==='n'&&!e.ctrlKey&&!e.metaKey&&document.getElementById('modalOverlay').style.display==='none'){
    const tag=document.activeElement.tagName;
    if(tag!=='INPUT'&&tag!=='TEXTAREA'&&tag!=='SELECT')openModal();
  }
});

loadFromCloud();
</script>
</body>
</html>
